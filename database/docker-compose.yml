services:
  postgres:
    image: postgres:17
    container_name: elclashicers-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - elclashicers-network

volumes:
  elclashicers-db:

networks:
  elclashicers-network:
    driver: bridge
    name: elclashicers-network